name: Build and deploy site

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 4 * * 1,4"
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          # Reclaim ~25-30 GB of preinstalled toolchains the build never uses,
          # so the full Nix store (SAM export + database + html + 2.6 GB site)
          # plus the deploy clone fit on the runner's root filesystem.
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: false
          swap-storage: false

      - uses: actions/checkout@v5

      - uses: DeterminateSystems/determinate-nix-action@v3

      - name: Cache Nix store
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          # Key on the Nix inputs. flake.nix carries samVersion, so a SAM bump
          # changes the key; restore-prefixes-first-match still restores the
          # most recent store so the toolchain + unchanged derivations are
          # reused and only changed paths rebuild.
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          # Trim the store before the post-job save so a cache entry stays well
          # under GitHub's 10 GB/repo budget (the 2.6 GB site is rebuilt on each
          # SAM bump anyway, so it isn't worth caching).
          gc-max-store-size-linux: 5G
          # Evict stale caches so twice-weekly runs don't accumulate entries.
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 604800 # older than 7 days
          purge-primary-key: never

      - name: Resolve latest SAM version
        id: sam
        run: |
          VERSION=$(curl -sL "https://www.vas.ehealth.fgov.be/websamcivics/samcivics/download/samv2-full-getLastVersion?xsd=5" \
            --connect-timeout 30 --max-time 120 --retry 5 --retry-delay 15 --retry-all-errors)
          if ! [[ "$VERSION" =~ ^[0-9]+$ ]]; then
            echo "ERROR: Could not determine latest version. Got: $VERSION"
            exit 1
          fi
          echo "Latest SAM version: $VERSION"

          URL="https://www.vas.ehealth.fgov.be/websamcivics/samcivics/download/samv2-download?type=FULL&xsd=5&version=${VERSION}"

          # Prefetch and compute SRI hash (matches fetchzip with stripRoot=false)
          HASH32=$(nix-prefetch-url --unpack --type sha256 --name source.zip "$URL")
          HASH=$(nix-hash --type sha256 --to-sri "$HASH32")
          echo "Hash: $HASH"

          sed -i "s/samVersion = \".*\"/samVersion = \"$VERSION\"/" flake.nix
          sed -i "s|samHash = \".*\"|samHash = \"$HASH\"|" flake.nix
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build site
        timeout-minutes: 45
        run: |
          nix build .#site --print-build-logs &>/tmp/nix-build.log
          EXIT=$?
          if [ $EXIT -ne 0 ]; then
            echo "===== BUILD FAILED (exit $EXIT), last 500 lines: ====="
            tail -n 500 /tmp/nix-build.log
            exit $EXIT
          fi
          df -h /

      - name: Deploy to Bunny
        env:
          BUNNY_STORAGE_ZONE: ${{ secrets.BUNNY_STORAGE_ZONE }}
          BUNNY_STORAGE_ENDPOINT: ${{ secrets.BUNNY_STORAGE_ENDPOINT }}
          BUNNY_STORAGE_PASSWORD: ${{ secrets.BUNNY_STORAGE_PASSWORD }}
          BUNNY_PULLZONE_ID: ${{ secrets.BUNNY_PULLZONE_ID }}
          BUNNY_API_KEY: ${{ secrets.BUNNY_API_KEY }}
        run: |
          # Incremental upload straight from the Nix store (no copy): diffs the
          # built site against a manifest in the bucket and uploads only changed
          # files, deletes removed ones, then purges the pull-zone cache.
          nix develop --command bun scripts/deploy-bunny.ts "$GITHUB_WORKSPACE/result"

      - name: Commit SAM version bump back to build repo
        working-directory: ${{ github.workspace }}
        run: |
          # Traceability: persist the resolved samVersion/samHash so future
          # cold builds skip re-hashing and the build repo records which SAM
          # version is currently live.
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git"
          git add flake.nix
          if git diff --cached --quiet; then
            echo "flake.nix unchanged — skipping back-commit"
          else
            git commit -m "Bump SAM version to ${{ steps.sam.outputs.version }}"
            git push
          fi
