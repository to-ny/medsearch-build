name: Build and deploy site

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main

      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Resolve latest SAM version
        id: sam
        run: |
          VERSION=$(curl -sL "https://www.vas.ehealth.fgov.be/websamcivics/samcivics/download/samv2-full-getLastVersion?xsd=5" --max-time 60 --retry 3 --retry-delay 10)
          if ! [[ "$VERSION" =~ ^[0-9]+$ ]]; then
            echo "ERROR: Could not determine latest version. Got: $VERSION"
            exit 1
          fi
          echo "Latest SAM version: $VERSION"

          URL="https://www.vas.ehealth.fgov.be/websamcivics/samcivics/download/samv2-download?type=FULL&xsd=5&version=${VERSION}"

          # Prefetch and compute SRI hash (matches fetchzip with stripRoot=false)
          HASH32=$(nix-prefetch-url --unpack --type sha256 --name source.zip "$URL")
          HASH=$(nix-hash --type sha256 --to-sri "$HASH32")
          echo "Hash: $HASH"

          sed -i "s/samVersion = \".*\"/samVersion = \"$VERSION\"/" flake.nix
          sed -i "s|samHash = \".*\"|samHash = \"$HASH\"|" flake.nix
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build site
        run: nix build .#site --print-build-logs

      - name: Deploy to medsearch
        run: |
          git clone https://x-access-token:${{ secrets.DEPLOY_TOKEN }}@github.com/to-ny/medsearch.git _public
          cd _public
          # Wipe everything except .git and README.md
          find . -maxdepth 1 -not -name '.git' -not -name '.' -not -name 'README.md' -exec rm -rf {} +
          # Site content into docs/
          mkdir -p docs
          cp -rL ../result/. docs
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to deploy"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "SAM v2 export v${{ steps.sam.outputs.version }}"
          git push
