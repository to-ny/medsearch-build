name: Build and deploy site

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 4 * * 1,4"
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main

      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Resolve latest SAM version
        id: sam
        run: |
          VERSION=$(curl -sL "https://www.vas.ehealth.fgov.be/websamcivics/samcivics/download/samv2-full-getLastVersion?xsd=5" --max-time 60 --retry 3 --retry-delay 10)
          if ! [[ "$VERSION" =~ ^[0-9]+$ ]]; then
            echo "ERROR: Could not determine latest version. Got: $VERSION"
            exit 1
          fi
          echo "Latest SAM version: $VERSION"

          URL="https://www.vas.ehealth.fgov.be/websamcivics/samcivics/download/samv2-download?type=FULL&xsd=5&version=${VERSION}"

          # Prefetch and compute SRI hash (matches fetchzip with stripRoot=false)
          HASH32=$(nix-prefetch-url --unpack --type sha256 --name source.zip "$URL")
          HASH=$(nix-hash --type sha256 --to-sri "$HASH32")
          echo "Hash: $HASH"

          sed -i "s/samVersion = \".*\"/samVersion = \"$VERSION\"/" flake.nix
          sed -i "s|samHash = \".*\"|samHash = \"$HASH\"|" flake.nix
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build site
        timeout-minutes: 45
        run: |
          nix build .#site --print-build-logs &>/tmp/nix-build.log
          EXIT=$?
          if [ $EXIT -ne 0 ]; then
            echo "===== BUILD FAILED (exit $EXIT), last 500 lines: ====="
            tail -n 500 /tmp/nix-build.log
            exit $EXIT
          fi
          df -h /

      - name: Free disk space
        run: |
          # Materialize site output out of the Nix store, then garbage-collect
          # everything. magic-nix-cache has already uploaded store paths to the
          # GitHub Actions cache, so dropping them here is safe.
          cp -rL result /tmp/site
          chmod -R u+w /tmp/site
          # First GC: removes build-only deps (SAM XML, Bun, SQLite, intermediates).
          # `result` is a GC root, so the site output is kept.
          nix-collect-garbage
          df -h /
          # Drop the GC root and collect the site output too.
          rm result
          nix-collect-garbage
          df -h /

      - name: Deploy to medsearch
        run: |
          # Shallow clone without checkout — we only need .git and README.md.
          # The old site content is replaced wholesale, so checking out 2.6 GB
          # of it only to delete it is wasted disk and time.
          git clone --depth=1 --no-checkout https://x-access-token:${{ secrets.DEPLOY_TOKEN }}@github.com/to-ny/medsearch.git _public
          cd _public
          git checkout HEAD -- README.md
          df -h .
          # New site content into docs/
          mkdir -p docs
          cp -rL /tmp/site/. docs
          rm -rf /tmp/site
          df -h .
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to deploy"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "SAM v2 export v${{ steps.sam.outputs.version }}"
          git push
