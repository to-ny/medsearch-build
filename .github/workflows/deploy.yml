name: Build site

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main

      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Resolve latest SAM version
        id: sam
        run: |
          VERSION=$(curl -sL "https://www.vas.ehealth.fgov.be/websamcivics/samcivics/download/samv2-full-getLastVersion?xsd=5" --max-time 15)
          if ! [[ "$VERSION" =~ ^[0-9]+$ ]]; then
            echo "ERROR: Could not determine latest version. Got: $VERSION"
            exit 1
          fi
          echo "Latest SAM version: $VERSION"

          URL="https://www.vas.ehealth.fgov.be/websamcivics/samcivics/download/samv2-download?type=FULL&xsd=5&version=${VERSION}"

          # Prefetch and compute SRI hash (matches fetchzip with stripRoot=false)
          HASH32=$(nix-prefetch-url --unpack --type sha256 --name source.zip "$URL")
          HASH=$(nix-hash --type sha256 --to-sri "$HASH32")
          echo "Hash: $HASH"

          sed -i "s/samVersion = \".*\"/samVersion = \"$VERSION\"/" flake.nix
          sed -i "s/samHash = \".*\"/samHash = \"$HASH\"/" flake.nix
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build site
        run: nix build .#site --print-build-logs

      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: result/
